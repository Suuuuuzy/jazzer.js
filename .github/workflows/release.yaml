name: Build & Release Tarballs
on:
  push:
    tags:
      - "v*"
    branches:
      - feat/electron-hooks # only trigger when tag is on this branch

jobs:
  build-pack:
    runs-on: macos-latest # build on macOS instead of Ubuntu
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - run: pnpm -w install --frozen-lockfile
      - run: pnpm -w build

      - run: |
          cd packages/core && npm pack && cd -
          cd packages/fuzzer && npm pack && cd -

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packages/core/*.tgz
            packages/fuzzer/*.tgz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
